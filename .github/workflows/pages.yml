name: Pages marketplace

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-marketplace
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - name: Download the complete published distribution set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.0.0 --pattern 'oh-my-zcode-3.0.0-*.zip' --dir releases/v3.0.0
          uv run scripts/publish_pages.py assemble --releases releases --output site --base-url https://unknoownu.github.io/oh-my-zcode/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
