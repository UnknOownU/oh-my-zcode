name: Native plugin

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distribution_base_url:
        description: HTTPS base URL for generated marketplaces; does not publish
        required: false
        default: https://example.invalid/oh-my-zcode/v3.0.0/

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: quality
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check
      - run: cargo install --locked cargo-machete --version 0.9.2
      - run: cargo machete
      - run: cargo install --locked rust-code-analysis-cli --version 0.0.25
      - run: cargo run --locked -p xtask -- quality --analyzer rust-code-analysis-cli --root .

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: oh-my-zcode.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: oh-my-zcode
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: oh-my-zcode
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: oh-my-zcode
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: oh-my-zcode
    runs-on: ${{ matrix.runner }}
    env:
      OHMY_ZCODE_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.binary }}
      DISTRIBUTION_BASE_URL: ${{ inputs.distribution_base_url || 'https://example.invalid/oh-my-zcode/v3.0.0/' }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo test --workspace --locked --target "${{ matrix.target }}"
      - run: cargo build --release --locked --target "${{ matrix.target }}" -p oh-my-zcode
      - name: Native process contracts
        run: |
          node test_gate.mjs
          node --test test_proof_gate.mjs test_proof_gate_events.mjs test_proof_gate_policy.mjs test_proof_gate_adversarial.mjs test_native_protocol.mjs test_workspace_boundary.mjs test_hook_security.mjs
      - name: Build immutable platform package
        run: cargo run --locked -p xtask -- package --target "${{ matrix.target }}" --binary "$OHMY_ZCODE_BIN" --output dist --base-url "$DISTRIBUTION_BASE_URL"
      - name: Exercise exact extracted archive
        run: cargo run --locked -p xtask -- smoke --target "${{ matrix.target }}" --archive "dist/${{ matrix.target }}/plugins/oh-my-zcode/3.0.0/plugin.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oh-my-zcode-3.0.0-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
