[package]
name = "xtask"
version = "3.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"
description = "Build and verify Oh My Zcode distributions"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
url = "2"
zip = { version = "8.6", default-features = false }
tempfile = "3"
wait-timeout = "0.2"
object = { version = "0.40", default-features = false, features = ["read_core", "std", "elf", "macho", "pe"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
