[package]
name = "oh-my-zcode"
version = "3.0.0"
edition = "2024"
rust-version = "1.96"
description = "Evidence, citation and scoped-execution gates for ZCode"
license = "MIT"
repository = "https://github.com/UnknOownU/Oh-My-Zcode"
readme = "README.md"
keywords = ["zcode", "verification", "evidence", "plugin"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [".", "xtask"]
resolver = "3"

[lib]
name = "oh_my_zcode"

[[bin]]
name = "oh-my-zcode"
path = "src/main.rs"

[features]
default = ["native-windows-metadata-skip-miri"]
native-windows-metadata-skip-miri = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
yaml_serde = "0.10"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"
jiff = "0.2"
file-id = "0.2"
wait-timeout = "0.2"
shlex = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["json"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
allow_attributes_without_reason = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
