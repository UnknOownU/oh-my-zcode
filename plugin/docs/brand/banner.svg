    <path d="M42 94V58Q42 42 58 42H94" stroke="#b7a0ff"/>
    <path d="M162 42H198Q214 42 214 58V94" stroke="#67dbe6"/>
    <path d="M214 162V198Q214 214 198 214H162" stroke="#f8bc6c"/>
    <path d="M94 214H58Q42 214 42 198V162" stroke="#f99f9a"/>
    <path d="M86 86H170L86 170H170" stroke="#f8fafc" stroke-width="18"/>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="312" y="70" fill="#aebed4" font-size="14" font-weight="600" letter-spacing="3">EVIDENCE-GATED AGENTS</text>
