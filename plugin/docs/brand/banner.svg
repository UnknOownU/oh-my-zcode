<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title description">
  <title id="title">Oh My Zcode — Fourfold Proof</title>
  <desc id="description">Four independent, colored gate corners frame a white Z. Oh My Zcode: Build. Challenge. Prove. Evidence-gated agents.</desc>
